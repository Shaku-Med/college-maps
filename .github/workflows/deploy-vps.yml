name: Deploy CSI Map to the VPS

# Mobile only pushes never get here; the app ships through EAS.
on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'backend/**'
      - 'deploy/**'
      - '.github/workflows/deploy-vps.yml'
  workflow_dispatch:

# Never let two deploys race on the box; an in flight one finishes first.
concurrency:
  group: deploy-csimap
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_BASE: ghcr.io/shaku-med/college-maps
  # Public addresses only. They are built into the website's browser code.
  SITE_ORIGIN: https://csimap.app
  REALTIME_ORIGIN: https://live.csimap.app
  # Public too: the Turnstile site key lives in the repo's Actions variables.
  TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}

jobs:
  test-go:
    name: Go vet and tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [bkapp, rtapp]
    defaults:
      run:
        working-directory: backend/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/${{ matrix.service }}/go.mod
          cache-dependency-path: backend/${{ matrix.service }}/go.mod
      - run: go vet ./...
      - run: go test ./...

  test-web:
    name: Website typecheck and lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          # Must match the runtime image in app/Dockerfile.
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint

  build:
    name: Build and push images
    runs-on: ubuntu-latest
    needs: [test-go, test-web]
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: api
            context: backend/bkapp
          - name: realtime
            context: backend/rtapp
          - name: web
            context: app
    steps:
      - uses: actions/checkout@v5
      - name: Check the site key
        run: '[ -n "$TURNSTILE_SITE_KEY" ] || { echo "::error::Set the TURNSTILE_SITE_KEY Actions variable"; exit 1; }'
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Unchanged services hit the cache and come out identical, so the box skips restarting them.
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=${{ env.SITE_ORIGIN }}
            NEXT_PUBLIC_REALTIME_URL=${{ env.REALTIME_ORIGIN }}
            NEXT_PUBLIC_TURNSTILE_SITE_KEY=${{ env.TURNSTILE_SITE_KEY }}
          labels: |
            org.opencontainers.image.source=https://github.com/Shaku-Med/college-maps
          tags: |
            ${{ env.IMAGE_BASE }}/${{ matrix.name }}:${{ github.sha }}
            ${{ env.IMAGE_BASE }}/${{ matrix.name }}:latest
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max

  deploy:
    name: Deploy over SSH
    runs-on: ubuntu-latest
    needs: build
    environment: production
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v5

      - name: Check the service settings
        env:
          API_ENV: ${{ secrets.CSIMAP_API_ENV }}
          REALTIME_ENV: ${{ secrets.CSIMAP_REALTIME_ENV }}
        run: |
          set -euo pipefail
          value() { printf '%s\n' "$1" | sed -n "s/^$2=//p" | head -n1 | tr -d '\r'; }
          # Only emptiness and equality are tested; values are never printed.
          # The API refuses to start on a bad email setup, so catch it here before the running one is replaced.
          case "$(value "$API_ENV" EMAIL_MODE)" in
            smtp) email_keys="EMAIL_FROM SMTP_HOST SMTP_PORT SMTP_USERNAME SMTP_PASSWORD" ;;
            resend) email_keys="EMAIL_FROM RESEND_API_KEY" ;;
            gmail) email_keys="EMAIL_FROM GMAIL_CLIENT_ID GMAIL_CLIENT_SECRET GMAIL_REFRESH_TOKEN" ;;
            *) echo "::error::EMAIL_MODE in CSIMAP_API_ENV must be smtp, resend or gmail"; exit 1 ;;
          esac
          for key in ALLOWED_ORIGINS DATABASE_URL AUTH_SECRET TICKET_SECRET TURNSTILE_SECRET $email_keys; do
            [ -n "$(value "$API_ENV" "$key")" ] || { echo "::error::$key is missing from CSIMAP_API_ENV"; exit 1; }
          done
          for key in ALLOWED_ORIGINS TICKET_SECRET; do
            [ -n "$(value "$REALTIME_ENV" "$key")" ] || { echo "::error::$key is missing from CSIMAP_REALTIME_ENV"; exit 1; }
          done
          [ "$(value "$API_ENV" TICKET_SECRET)" = "$(value "$REALTIME_ENV" TICKET_SECRET)" ] \
            || { echo "::error::TICKET_SECRET differs between the API and the live server"; exit 1; }

      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          [ -n "$SSH_KEY" ] && [ -n "$KNOWN_HOSTS" ] || { echo "::error::VPS_SSH_KEY or VPS_KNOWN_HOSTS is missing"; exit 1; }
          install -d -m 700 ~/.ssh
          ( umask 077; printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy; printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts )

      - name: Stage files on the box
        env:
          API_ENV: ${{ secrets.CSIMAP_API_ENV }}
          REALTIME_ENV: ${{ secrets.CSIMAP_REALTIME_ENV }}
          TARGET: ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}
        run: |
          set -euo pipefail
          stage="$(mktemp -d)"
          trap 'rm -rf "$stage"' EXIT
          printf '%s\n' "$API_ENV" > "$stage/api.env"
          printf '%s\n' "$REALTIME_ENV" > "$stage/realtime.env"
          printf 'API_IMAGE=%s\nREALTIME_IMAGE=%s\nWEB_IMAGE=%s\n' \
            "$IMAGE_BASE/api:$GITHUB_SHA" "$IMAGE_BASE/realtime:$GITHUB_SHA" "$IMAGE_BASE/web:$GITHUB_SHA" > "$stage/.env"
          cp deploy/compose.yaml "$stage/compose.yaml"
          ssh_opts=(-i ~/.ssh/deploy -o StrictHostKeyChecking=yes -o BatchMode=yes)
          ssh "${ssh_opts[@]}" "$TARGET" 'rm -rf ~/csimap-staging && install -d -m 700 ~/csimap-staging'
          scp "${ssh_opts[@]}" -q "$stage/.env" "$stage/api.env" "$stage/realtime.env" "$stage/compose.yaml" "$TARGET:csimap-staging/"

      - name: Pull and restart
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET: ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}
        run: |
          set -euo pipefail
          ssh_opts=(-i ~/.ssh/deploy -o StrictHostKeyChecking=yes -o BatchMode=yes)
          on_box() { ssh "${ssh_opts[@]}" "$TARGET" "$@"; }
          on_box 'sudo /usr/local/sbin/csimap-promote.sh'
          printf '%s' "$GHCR_TOKEN" | on_box "sudo /usr/local/sbin/csimap-compose.sh login $GITHUB_ACTOR"
          trap 'on_box "sudo /usr/local/sbin/csimap-compose.sh logout" || true' EXIT
          on_box 'sudo /usr/local/sbin/csimap-compose.sh pull'
          # Container logs stay on the box: this repo is public, and so are its Action logs.
          on_box 'sudo /usr/local/sbin/csimap-compose.sh up' || { on_box 'sudo /usr/local/sbin/csimap-compose.sh ps' || true; echo "::error::A service failed its healthcheck. Run csimap-compose.sh logs on the box."; exit 1; }
          on_box 'sudo /usr/local/sbin/csimap-compose.sh prune' || true
          on_box 'sudo /usr/local/sbin/csimap-compose.sh ps'

      - name: Remove the key
        if: always()
        run: rm -f ~/.ssh/deploy
