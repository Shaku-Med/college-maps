# Live reload for development: run `air` in this folder. Settings come from .env.development.
root = "."
tmp_dir = "tmp"

[build]
cmd = "go build -o ./tmp/api.exe ./cmd/api"
entrypoint = ["./tmp/api.exe"]
include_ext = ["go", "sql", "json"]
exclude_dir = ["tmp", "vendor", "testdata"]
exclude_regex = ['_test\.go$']
delay = 500
stop_on_error = true

[misc]
clean_on_exit = true
