# CSI Map on the VPS. From the repo root: docker compose -f deploy/compose.yaml up -d --build
# Ports bind to 127.0.0.1 only, so nothing but the host's nginx can reach them.
name: csimap

x-hardened: &hardened
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /tmp
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

services:
  api:
    <<: *hardened
    build: ../backend/bkapp
    image: csimap-api
    env_file: .env.api
    environment:
      APP_ENV: production
      PORT: "8080"
      CLIENT_IP_HEADER: X-Real-IP
    ports:
      - "127.0.0.1:3101:8080"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  realtime:
    <<: *hardened
    build: ../backend/rtapp
    image: csimap-realtime
    env_file: .env.realtime
    environment:
      APP_ENV: production
      PORT: "8090"
      CLIENT_IP_HEADER: X-Real-IP
    ports:
      - "127.0.0.1:3102:8090"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M

  web:
    <<: *hardened
    build:
      context: ../app
      args:
        NEXT_PUBLIC_API_URL: ${SITE_ORIGIN:?set SITE_ORIGIN in deploy/.env}
        NEXT_PUBLIC_REALTIME_URL: ${REALTIME_ORIGIN:?set REALTIME_ORIGIN in deploy/.env}
    image: csimap-web
    tmpfs:
      - /tmp
      - /app/.next/cache:uid=1000,gid=1000
    ports:
      - "127.0.0.1:3100:3000"
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 512M
