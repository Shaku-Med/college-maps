# CSI Map on the VPS, run from /opt/csimap by csimap-compose.sh.
# CI writes .env (the pinned image tags) and the two service env files; nothing is built on the box.
# Ports bind to 127.0.0.1 only, so nothing but the host's nginx can reach them.
name: csimap

x-hardened: &hardened
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /tmp
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

services:
  api:
    <<: *hardened
    image: ${API_IMAGE:?API_IMAGE missing from .env}
    container_name: csimap-api
    env_file: ./api.env
    environment:
      APP_ENV: production
      PORT: "8080"
      CLIENT_IP_HEADER: X-Real-IP
    ports:
      - "127.0.0.1:3101:8080"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  realtime:
    <<: *hardened
    image: ${REALTIME_IMAGE:?REALTIME_IMAGE missing from .env}
    container_name: csimap-realtime
    env_file: ./realtime.env
    environment:
      APP_ENV: production
      PORT: "8090"
      CLIENT_IP_HEADER: X-Real-IP
    ports:
      - "127.0.0.1:3102:8090"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M

  web:
    <<: *hardened
    image: ${WEB_IMAGE:?WEB_IMAGE missing from .env}
    container_name: csimap-web
    tmpfs:
      - /tmp
      - /app/.next/cache:uid=1000,gid=1000
    ports:
      - "127.0.0.1:3100:3000"
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 512M
