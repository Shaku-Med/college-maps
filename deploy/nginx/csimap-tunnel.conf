# CSI Map behind a Cloudflare Tunnel. cloudflared on this box is the only thing that reaches 127.0.0.1:8081,
# and Cloudflare's edge does TLS, so there is no certificate here.
# Copy to /etc/nginx/sites-available/csimap-tunnel and link it into sites-enabled.
limit_req_zone $binary_remote_addr zone=csimap_edge:10m rate=30r/s;

# Anything that is not one of our names gets the connection dropped.
server {
    listen 127.0.0.1:8081 default_server;
    return 444;
}

server {
    listen 127.0.0.1:8081;
    server_name www.csimap.app;
    return 301 https://csimap.app$request_uri;
}

server {
    listen 127.0.0.1:8081;
    server_name csimap.app;
    client_max_body_size 1m;

    # Only cloudflared connects here, so its visitor header is the real address the apps and limits use.
    set_real_ip_from 127.0.0.1;
    real_ip_header CF-Connecting-IP;

    location ~ /\.(?!well-known/) {
        return 404;
    }

    location /v1/ {
        limit_req zone=csimap_edge burst=100 nodelay;
        proxy_pass http://127.0.0.1:3101;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
}

server {
    listen 127.0.0.1:8081;
    server_name live.csimap.app;
    client_max_body_size 16k;

    set_real_ip_from 127.0.0.1;
    real_ip_header CF-Connecting-IP;

    location / {
        proxy_pass http://127.0.0.1:3102;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        # Live streams must reach the phone as they happen, not after nginx fills a buffer.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }
}
