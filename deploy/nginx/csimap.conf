# Copy to /etc/nginx/sites-available/csimap, link it into sites-enabled, then run certbot --nginx for all three names.
# Needs cloudflare-real-ip.conf in /etc/nginx/snippets and cloudflare-geo.conf in /etc/nginx/conf.d.
# A whole campus can share one Wi-Fi address, so this is only a flood guard; the API keeps its own limits.
limit_req_zone $binary_remote_addr zone=csimap_api:10m rate=30r/s;

server {
    listen 80;
    listen [::]:80;
    server_name www.csimap.app;
    return 301 https://csimap.app$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name csimap.app;
    client_max_body_size 1m;
    include snippets/csimap-cloudflare.conf;

    # Nothing real lives at a dot path, so scanners hunting .env or .git get a plain 404 before the app.
    location ~ /\.(?!well-known/) {
        return 404;
    }

    # The API answers /v1 on the site's own address, so the session cookie stays first party.
    location /v1/ {
        limit_req zone=csimap_api burst=100 nodelay;
        proxy_pass http://127.0.0.1:3101;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Where a sign in came from, for the owner's alert. Empty, and so left out, unless Cloudflare carried it.
        proxy_set_header Cf-Ipcity $csimap_cf_city;
        proxy_set_header Cf-Region $csimap_cf_region;
        proxy_set_header Cf-Ipcountry $csimap_cf_country;
    }

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name live.csimap.app;
    client_max_body_size 16k;
    include snippets/csimap-cloudflare.conf;

    location / {
        proxy_pass http://127.0.0.1:3102;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        # Live streams must reach the phone as they happen, not after nginx fills a buffer.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }
}
