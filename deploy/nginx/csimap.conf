# Copy to /etc/nginx/sites-available/csimap, link it into sites-enabled, then run certbot --nginx for both names.
# A whole campus can share one Wi-Fi address, so this is only a flood guard; the API keeps its own limits.
limit_req_zone $binary_remote_addr zone=csimap_api:10m rate=30r/s;

server {
    listen 80;
    listen [::]:80;
    server_name csimap.brozy.org;
    client_max_body_size 1m;

    # The API answers /v1 on the site's own address, so the session cookie stays first party.
    location /v1/ {
        limit_req zone=csimap_api burst=100 nodelay;
        proxy_pass http://127.0.0.1:3101;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name csimap-live.brozy.org;
    client_max_body_size 16k;

    location / {
        proxy_pass http://127.0.0.1:3102;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        # Live streams must reach the phone as they happen, not after nginx fills a buffer.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }
}
